    <line x1="-82" y1="0" x2="82" y2="0" stroke="#0e8a43" stroke-width="5.5" />
    <!-- Latitude Lines -->
    <ellipse cx="0" cy="0" rx="82" ry="38" fill="none" stroke="#0e8a43" stroke-width="5.5" />
    <ellipse cx="0" cy="0" rx="82" ry="68" fill="none" stroke="#0e8a43" stroke-width="5" />
    <!-- Prime Meridian -->
    <line x1="0" y1="-82" x2="0" y2="82" stroke="#0e8a43" stroke-width="5.5" />
    <!-- Longitude Lines -->
    <ellipse cx="0" cy="0" rx="38" ry="82" fill="none" stroke="#0e8a43" stroke-width="5.5" />
  </g>

